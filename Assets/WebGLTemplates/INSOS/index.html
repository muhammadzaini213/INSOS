<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="screen-orientation" content="landscape">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="INSOS JAYA JAYA">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow: hidden; width: 100%; height: 100%; background: #000; }
        #unity-canvas { width: 100%; height: 100%; touch-action: none; }
    </style>
</head>
<body>
    <canvas id="unity-canvas"></canvas>

    <script>
        // Hide iOS Safari URL bar
        function hideSafariBar() {
            window.scrollTo(0, 1);
            setTimeout(function() { window.scrollTo(0, 0); }, 100);
        }

        window.addEventListener('load', hideSafariBar);
        window.addEventListener('orientationchange', function() {
            setTimeout(hideSafariBar, 500);
        });

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";

        var config = {
            dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
            frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
            codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
            memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
            symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
            streamingAssetsUrl: "StreamingAssets",
            companyName: "{{{ COMPANY_NAME }}}",
            productName: "{{{ PRODUCT_NAME }}}",
            productVersion: "{{{ PRODUCT_VERSION }}}"
        };

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
            createUnityInstance(document.querySelector("#unity-canvas"), config, function (progress) {
            }).catch(function (message) {
                alert(message);
            });
        };
        document.body.appendChild(script);
</body>
</html>
